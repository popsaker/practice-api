services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practice-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - practice
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practice-api-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=1 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - practice
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practice-api-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - practice
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: practice-api-nginx
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - practice
    ports:
      - "8080:80"

  mysql:
    image: mysql:8.4
    container_name: practice-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: practice
      MYSQL_USER: practice
      MYSQL_PASSWORD: practice_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - practice
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: practice-api-redis
    restart: unless-stopped
    networks:
      - practice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  practice:

volumes:
  mysql_data:
